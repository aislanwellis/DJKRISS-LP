# /etc/nginx/sites-available/djkriss-pre-save.conf
server {
    listen 80;
    listen [::]:80;
    server_name djkriss-pre-save.auforria.com;

    root /var/www/djkriss-pre-save;
    index index.html;

    # arquivos privados nunca são servidos
    location ~ ^/(server|deploy)(/|$) { return 404; }
    location ~ /\.  { return 404; }

    # API do mural → Node (127.0.0.1:3077)
    location /api/ {
        proxy_pass http://127.0.0.1:3077;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 8k;
    }

    location / { try_files $uri $uri/ =404; }

    location ~* \.(webp|png|jpg|mp3|woff2?)$ { expires 7d; add_header Cache-Control "public"; }
    location ~* \.(js|css)$ { expires 1h; add_header Cache-Control "public"; }

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;
}
